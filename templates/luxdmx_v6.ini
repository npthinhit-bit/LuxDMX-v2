# LuxDMX v6 PCB (ESP32-S3 + W5500 SPI-Ethernet). Shares the esp32s3dev build;
# the owner flashes that firmware and selects this template in /config -> Hardware.
# Compile-time flags: -DBOARD_LUXDMX_V6 -DDEFAULT_TEMPLATE=luxdmx_v6.
extends=_base

# 5-LED status panel (discrete GPIO, ledType 3)
ledtype=3
ledr=1
ledg=2
ledy=6
ledb=7
ledw=15
# Balance the panel: green + white are far brighter per mA
ledbrr=255
ledbrg=8
ledbry=255
ledbrb=255
ledbrw=17

# Output A: RMT ch0 + UART1 RX — RDM full (DE/RE GPIO8)
a_en=1
a_uni=0
a_net=0
a_sub=0
a_sacn=1
a_port=1
a_tx=17
a_rx=18
a_rts=8
a_mode=1
a_brk=176
a_mab=12
a_inv=0

# Output B: RMT ch1 + UART2 RX — RDM full (DE/RE GPIO7)
b_en=1
b_uni=1
b_net=0
b_sub=0
b_sacn=2
b_port=2
b_tx=16
b_rx=15
b_rts=7
b_mode=1
b_brk=176
b_mab=12
b_inv=0

# W5500 SPI on host SPI3 (SCLK=12 MOSI=11 MISO=13 CS=10 INT=9 RST=3)
ethw5500=1
ethcs=10
ethsck=12
ethmosi=11
ethmiso=13
ethint=9
ethrst=3
ethfreq=20
ethspiphy=0

# Display header J4 (I2C SDA=4 SCL=5, optional OLED)
dispsda=4
dispscl=5

# WiFi is the default; W5500 picked at runtime via cfg.useEthernet
