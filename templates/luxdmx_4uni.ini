# LuxDMX-4uni board (ESP32-S3-WROOM-2 N16R8 + onboard W5500). 4 independent DMX
# universes: A (RMT ch0 + UART1 RX, RDM) and B (RMT ch1 + UART2 RX, RDM) are
# RDM-capable; C (RMT ch2) and D (RMT ch3, DMA-capable) are DMX-only.
# Compile-time flags stay in platformio.ini (USE_ETH_SPI, board, custom_sdkconfig,
# BOARD_LUXDMX_4UNI); this template only carries the runtime default VALUES.
extends=_base

# 5-LED status panel (ledpin stays the _base GPIO2 default, unused at ledtype 3)
ledtype=3
ledr=1
ledg=2
ledy=6
ledb=7
ledw=15
# Balance the panel: the green + white LEDs are far brighter per mA than the others
ledbrr=255
ledbrg=8
ledbry=255
ledbrb=255
ledbrw=17

# Universe A: RMT ch0 + UART1 RX — RDM full (DE/RE GPIO8)
a_en=1
a_uni=0
a_port=1
a_tx=17
a_rx=18
a_rts=8
a_mode=1

# Universe B: RMT ch1 + UART2 RX — RDM full (DE/RE GPIO7)
b_en=1
b_uni=1
b_port=2
b_tx=16
b_rx=15
b_rts=7
b_mode=1

# Universe C: RMT ch2 — DMX only (no UART RX, no RDM)
c_en=1
c_uni=2
c_port=0
c_tx=5
c_rx=-1
c_rts=-1
c_mode=0

# Universe D: RMT ch3 (DMA-capable) — DMX only
d_en=1
d_uni=3
d_port=0
d_tx=6
d_rx=-1
d_rts=-1
d_mode=0

# W5500 SPI pins (module is opt-in at runtime; WiFi is the default)
ethcs=10
ethsck=12
ethmosi=11
ethmiso=13
ethint=9
ethrst=3

# Display header pre-wired (panel stays off until enabled)
dispsda=4
dispscl=5
dispsck=39
dispmosi=40
dispcs=41
dispdc=42
disprst=38
