[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
upload_port = COM3
upload_protocol = esptool

[env:esp32dev]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

[env:wt32eth01]
board = wt32-eth01
board_build.mcu = esp32
board_build.f_cpu = 240000000L

[env:esp32s3_psram]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.psram_type = opi

[env:native]
platform = native
