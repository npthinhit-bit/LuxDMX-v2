[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
upload_port = COM7
upload_protocol = esptool

[env:esp32dev]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
build_flags = -DLUXDMX_DEFAULT_TEMPLATE="esp32dev" -DOTA_SIGN_ENABLED=0

[env:wt32eth01]
board = wt32-eth01
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
build_flags = -DLUXDMX_DEFAULT_TEMPLATE="wt32eth01" -DOTA_SIGN_ENABLED=0

[env:esp32s3_psram]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.partitions = partitions.csv
build_flags = -DLUXDMX_DEFAULT_TEMPLATE="esp32s3_psram" -DOTA_SIGN_ENABLED=0

[env:esp32dev_release]
extends = env:esp32dev
build_flags = -DLUXDMX_DEFAULT_TEMPLATE="esp32dev" -DOTA_SIGN_ENABLED=1

[env:wt32eth01_release]
extends = env:wt32eth01
build_flags = -DLUXDMX_DEFAULT_TEMPLATE="wt32eth01" -DOTA_SIGN_ENABLED=1

[env:esp32s3_psram_release]
extends = env:esp32s3_psram
build_flags = -DLUXDMX_DEFAULT_TEMPLATE="esp32s3_psram" -DOTA_SIGN_ENABLED=1

[env:native]
; Native host test harness for Phase-0 unit tests (see tools/native_run.py).
; PlatformIO's native env is a stub; the cmake/ctest runner is driven directly:
;     python3 tools/native_run.py            # configure + build + test
;     python3 tools/native_run.py --clean    # wipe build dir, fresh build
;     python3 tools/native_run.py --verbose  # show per-test output (-V to ctest)
platform = native
