name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  PYTHON: '3.11'

jobs:
  build:
    name: Build Release Firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32dev
          - esp32s3dev
          - wt32eth01
          - esp32s3_psram
          - esp32s3_n16r8_eth
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Generate config templates
        run: python3 tools/gen_config_templates.py .
        shell: bash

      - name: Generate PROGMEM headers
        run: |
          python3 extra_scripts.py 2>/dev/null; true
        shell: bash

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
        shell: bash

      - name: Extract memory footprint
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          python3 scripts/extract_sizes.py ${{ matrix.env }} "$BUILD_DIR/firmware.elf" --output "memory-${{ matrix.env }}.json" 2>/dev/null || \
          python3 scripts/extract_sizes.py ${{ matrix.env }} "$BUILD_DIR/firmware.map" --from-map --output "memory-${{ matrix.env }}.json" 2>/dev/null || \
          echo '{"env": "${{ matrix.env }}", "error": "no size info"}' > "memory-${{ matrix.env }}.json"
        shell: bash

      - name: Generate manifest
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          python3 scripts/gen_manifest.py ${{ matrix.env }} "$BUILD_DIR/firmware.bin" \
            --sha256 \
            --elf "$BUILD_DIR/firmware.elf" \
            --map "$BUILD_DIR/firmware.map" \
            --memory-report "memory-${{ matrix.env }}.json" \
            --output "manifest-${{ matrix.env }}.json"
        shell: bash

      - name: Sign firmware (if OTASIGN_ENABLED for this env)
        id: sign
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          # OTA_SIGN_ENABLED defaults to 1 for esp32s3_n16r8_eth (production build)
          # For other envs, it is explicitly set to 0 in platformio.ini
          if [ "${{ matrix.env }}" = "esp32s3_n16r8_eth" ]; then
            if [ -n "${{ secrets.OTA_SIGN_KEY }}" ]; then
              echo "OTA_SIGN=true" >> $GITHUB_OUTPUT
              # Write the private key to a temp file
              echo "${{ secrets.OTA_SIGN_KEY }}" > /tmp/ota_private.pem
              python3 tools/sign_ota.py "$BUILD_DIR/firmware.bin" /tmp/ota_private.pem "$BUILD_DIR/firmware-signed.bin"
              echo "Signed firmware created"
            else
              echo "OTA_SIGN=false" >> $GITHUB_OUTPUT
              echo "WARNING: OTA_SIGN_KEY secret not available; skipping signing"
            fi
          else
            echo "OTA_SIGN=false" >> $GITHUB_OUTPUT
            echo "Env ${{ matrix.env }} has OTA_SIGN_ENABLED=0; skipping signing"
          fi
        shell: bash

      - name: Compute SHA256 checksums
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          cd "$BUILD_DIR"
          sha256sum firmware.bin > "../../../sha256-${{ matrix.env }}.txt"
          sha256sum firmware.elf > "../../../sha256-${{ matrix.env }}-elf.txt"
          if [ -f "firmware-signed.bin" ]; then
            sha256sum firmware-signed.bin > "../../../sha256-${{ matrix.env }}-signed.txt"
          fi
          cd -
        shell: bash

      - name: Prepare release artifacts
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          mkdir -p "release_artifacts/${{ matrix.env }}"

          # Unsigned firmware
          cp "$BUILD_DIR/firmware.bin" "release_artifacts/${{ matrix.env }}/firmware-${{ matrix.env }}.bin"
          cp "$BUILD_DIR/firmware.elf" "release_artifacts/${{ matrix.env }}/firmware-${{ matrix.env }}.elf"

          # Map file (for debugging)
          if [ -f "$BUILD_DIR/firmware.map" ]; then
            cp "$BUILD_DIR/firmware.map" "release_artifacts/${{ matrix.env }}/firmware-${{ matrix.env }}.map"
          fi

          # Signed firmware (if produced)
          if [ -f "$BUILD_DIR/firmware-signed.bin" ]; then
            cp "$BUILD_DIR/firmware-signed.bin" "release_artifacts/${{ matrix.env }}/firmware-${{ matrix.env }}-signed.bin"
          fi

          # Manifest and memory report
          cp "manifest-${{ matrix.env }}.json" "release_artifacts/${{ matrix.env }}/manifest-${{ matrix.env }}.json"
          cp "memory-${{ matrix.env }}.json" "release_artifacts/${{ matrix.env }}/memory-${{ matrix.env }}.json"

          # SHA256 checksums file
          cp "sha256-${{ matrix.env }}.txt" "release_artifacts/${{ matrix.env }}/SHA256SUMS.txt"
          if [ -f "sha256-${{ matrix.env }}-signed.txt" ]; then
            cat "sha256-${{ matrix.env }}-signed.txt" >> "release_artifacts/${{ matrix.env }}/SHA256SUMS.txt"
          fi
          cat "sha256-${{ matrix.env }}-elf.txt" >> "release_artifacts/${{ matrix.env }}/SHA256SUMS.txt"

          echo "Artifacts prepared for ${{ matrix.env }}"
          ls -la "release_artifacts/${{ matrix.env }}/"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware-${{ matrix.env }}
          path: release_artifacts/${{ matrix.env }}/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-firmware-*
          path: release_artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release_final
          for env in esp32dev esp32s3dev wt32eth01 esp32s3_psram esp32s3_n16r8_eth; do
            if [ -d "release_artifacts" ]; then
              cp -r "release_artifacts/$env/"* "release_final/" 2>/dev/null || true
            fi
          done
          echo "=== Release files ==="
          ls -la release_final/
        shell: bash

      - name: Generate consolidated manifest
        run: |
          python3 -c "
          import json, os, glob
          manifests = []
          for m in sorted(glob.glob('release_final/manifest-*.json')):
              with open(m) as f:
                  manifests.append(json.load(f))
          combined = {
              'builds': manifests,
              'generated_at': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
          }
          with open('release_final/manifest.json', 'w') as f:
              json.dump(combined, f, indent=2)
          print(json.dumps(combined, indent=2))
          "
        shell: bash

      - name: Generate SHA256SUMS for all artifacts
        run: |
          cd release_final
          find . -type f \( -name "*.bin" -o -name "*.elf" \) -exec sha256sum {} \; > SHA256SUMS.txt
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt
        shell: bash

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "## Firmware Release $TAG" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "Released on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Changes" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%an)" $PREV_TAG..HEAD >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Artifacts" >> $GITHUB_OUTPUT
            for env in esp32dev esp32s3dev wt32eth01 esp32s3_psram esp32s3_n16r8_eth; do
              if [ -f "release_final/firmware-$env.bin" ]; then
                SIZE=$(stat -c%s "release_final/firmware-$env.bin" 2>/dev/null || stat -f%z "release_final/firmware-$env.bin")
                SHA=$(sha256sum "release_final/firmware-$env.bin" | cut -d' ' -f1)
                echo "- **$env**: firmware.bin ($SIZE bytes), SHA256: \`$SHA\`" >> $GITHUB_OUTPUT
                if [ -f "release_final/firmware-$env-signed.bin" ]; then
                  echo "  - Signed firmware (Ed25519) also available" >> $GITHUB_OUTPUT
                fi
              fi
            done
            echo "" >> $GITHUB_OUTPUT
            echo "### Memory Usage" >> $GITHUB_OUTPUT
            echo "| Env | Flash % | RAM % |" >> $GITHUB_OUTPUT
            echo "|---|---|---|" >> $GITHUB_OUTPUT
            for env in esp32dev esp32s3dev wt32eth01 esp32s3_psram esp32s3_n16r8_eth; do
              if [ -f "release_final/memory-$env.json" ]; then
                python3 -c "
                import json
                with open('release_final/memory-$env.json') as f:
                    m = json.load(f)
                pct = m.get('usage_pct', {})
                print(f'| $env | {pct.get(\"flash_pct\", \"N/A\")}% | {pct.get(\"ram_pct\", \"N/A\")}% |')
                " >> $GITHUB_OUTPUT
              fi
            done
            echo "" >> $GITHUB_OUTPUT
            echo "### How to verify" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo 'sha256sum -c SHA256SUMS.txt' >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Signing" >> $GITHUB_OUTPUT
            echo "The \`esp32s3_n16r8_eth\` build ships with \`OTA_SIGN_ENABLED=1\` (Ed25519 signature verification)." >> $GITHUB_OUTPUT
            echo "Signed firmware images have the 64-byte signature appended to the .bin." >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "release_notes=Initial release $TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_final/*
          body: ${{ steps.release_notes.outputs.release_notes }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          tag_name: ${{ github.ref_name }}
          name: LuxDMX-v2 ${{ github.ref_name }}
