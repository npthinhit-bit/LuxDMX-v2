name: LuxDMX CI/CD

on:
  pull_request:
  push:
    branches: [idf-only, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_CACHE_DIR: .cache/pip
  PIO_CACHE_DIR: .pio

jobs:
  native-unit:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Prepare native diagnostics directory
        run: mkdir -p ci-artifacts/native-unit
      - name: Native unit tests
        run: |
          set -o pipefail
          python3 tools/native_run.py --clean 2>&1 | tee ci-artifacts/native-unit/native-run.log
      - name: Capture native failure context
        if: always()
        run: python3 tools/ci_capture_context.py --output-dir ci-artifacts/native-unit/context --label native-unit
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-native-unit
          if-no-files-found: error
          path: ci-artifacts/native-unit
          retention-days: 14

  firmware-build:
    name: Firmware ${{ matrix.env }}
    needs: native-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, wt32eth01, esp32s3_psram]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PlatformIO
        run: pip install platformio
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults*', 'components/**/CMakeLists.txt') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-
            pio-${{ runner.os }}-
      - name: Prepare firmware diagnostics directory
        run: mkdir -p ci-artifacts/firmware-${{ matrix.env }}
      - name: Build firmware
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} 2>&1 | tee ci-artifacts/firmware-${{ matrix.env }}/platformio.log
      - name: Generate firmware size and metadata report
        run: |
          python3 tools/firmware_artifact_report.py \
            --environment "${{ matrix.env }}" \
            --build-dir ".pio/build/${{ matrix.env }}" \
            --output "ci-artifacts/firmware-${{ matrix.env }}/firmware-artifact.json"
      - name: Upload firmware metadata report
        uses: actions/upload-artifact@v4
        with:
          name: firmware-metadata-${{ matrix.env }}
          if-no-files-found: error
          path: ci-artifacts/firmware-${{ matrix.env }}/firmware-artifact.json
          retention-days: 14
      - name: Capture firmware failure context
        if: always()
        run: python3 tools/ci_capture_context.py --output-dir ci-artifacts/firmware-${{ matrix.env }}/context --label firmware-${{ matrix.env }}
      - name: Upload firmware diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-firmware-${{ matrix.env }}
          if-no-files-found: error
          path: ci-artifacts/firmware-${{ matrix.env }}
          retention-days: 14
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          if-no-files-found: error
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
          retention-days: 14

  docs-hygiene:
    name: Documentation and generated-file hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare documentation diagnostics directory
        run: mkdir -p ci-artifacts/docs-hygiene
      - name: Documentation and repository checks
        run: |
          set -o pipefail
          {
            python3 tools/repository_hygiene.py
            python3 tools/test_repository_hygiene.py
            test ! -d .pio
            test ! -d test/build
            test -s docs/REFACTOR_PLAN.md
            git diff --check
          } 2>&1 | tee ci-artifacts/docs-hygiene/hygiene.log
      - name: Capture documentation failure context
        if: always()
        run: python3 tools/ci_capture_context.py --output-dir ci-artifacts/docs-hygiene/context --label docs-hygiene
      - name: Upload documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-docs-hygiene
          if-no-files-found: error
          path: ci-artifacts/docs-hygiene
          retention-days: 14

  package:
    name: Package firmware release
    if: github.event_name != 'pull_request'
    needs: [firmware-build, docs-hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package diagnostics directory
        run: mkdir -p ci-artifacts/package
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist/firmware
      - name: Build release manifest and archive
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee ci-artifacts/package/package.log) 2>&1
          mkdir -p dist/firmware-release
          cp -R dist/firmware/. dist/firmware-release/
          find dist/firmware-release -type f -print0 | sort -z | xargs -0 sha256sum > dist/firmware-release/SHA256SUMS
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('dist/firmware-release')
          files = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'manifest.json':
                  files.append({
                      'path': str(path.relative_to(root)),
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          manifest = {
              'project': 'LuxDMX-v2',
              'ref': '${{ github.ref }}',
              'commit': '${{ github.sha }}',
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          tar -C dist -czf dist/luxdmx-firmware-${GITHUB_SHA}.tar.gz firmware-release
      - name: Capture package failure context
        if: always()
        run: python3 tools/ci_capture_context.py --output-dir ci-artifacts/package/context --label package
      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-package
          if-no-files-found: error
          path: ci-artifacts/package
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          if-no-files-found: error
          path: |
            dist/firmware-release
            dist/luxdmx-firmware-${{ github.sha }}.tar.gz
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release diagnostics directory
        run: mkdir -p ci-artifacts/release
      - uses: actions/download-artifact@v4
        with:
          name: firmware-release
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee ci-artifacts/release/release.log) 2>&1
          gh release create "$GITHUB_REF_NAME" dist/luxdmx-firmware-*.tar.gz dist/firmware-release/SHA256SUMS dist/firmware-release/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "LuxDMX $GITHUB_REF_NAME" \
            --generate-notes
      - name: Capture release failure context
        if: always()
        run: python3 tools/ci_capture_context.py --output-dir ci-artifacts/release/context --label release
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-release
          if-no-files-found: error
          path: ci-artifacts/release
          retention-days: 30